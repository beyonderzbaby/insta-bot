<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insta Connect Mini App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 flex flex-col items-center justify-center">

    <div class="w-full max-w-md bg-gray-800 rounded-2xl p-6 shadow-xl border border-gray-700">
        <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
            <span class="w-3 h-3 bg-red-500 rounded-full inline-block"></span> Insta Connect
        </h2>

        <div class="mb-4">
            <label class="block text-sm text-gray-400 mb-2">Connect Profile</label>
            <div class="flex gap-2">
                <input type="text" id="usernameInput" placeholder="@username" 
                    class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-purple-500">
                <button id="connectBtn" onclick="fetchProfile()" 
                    class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-semibold px-6 py-3 rounded-xl transition-all">
                    Connect
                </button>
            </div>
        </div>

        <div id="statusBox" class="hidden mt-4 p-4 bg-gray-900 rounded-xl border border-gray-700 text-sm text-gray-300">
            Status: <span id="statusText">Processing...</span>
        </div>
    </div>

    <script>
        // Telegram WebApp Initialize
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        async function fetchProfile() {
            const input = document.getElementById('usernameInput');
            const btn = document.getElementById('connectBtn');
            const statusBox = document.getElementById('statusBox');
            const statusText = document.getElementById('statusText');

            let username = input.value.trim().replace('@', '');
            if (!username) {
                alert("Kripya Instagram Username enter karein!");
                return;
            }

            // UI State updates
            btn.disabled = true;
            btn.innerText = "Fetching...";
            statusBox.classList.remove('hidden');
            statusText.innerText = "Server se connect ho raha hai (Sleep mode se jaagne me 20-30s lag sakte hain)...";

            const BACKEND_URL = `https://insta-backend-1ig5.onrender.com/api/instagram/${username}`;

            try {
                // Extended Timeout for Render Cold Start
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 60000);

                const response = await fetch(BACKEND_URL, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!response.ok) {
                    throw new Error(`Server status: ${response.status}`);
                }

                const data = await response.json();
                statusText.innerText = "Data mil gaya!";
                alert("Success! Profile Data: " + JSON.stringify(data));

            } catch (error) {
                if (error.name === 'AbortError') {
                    statusText.innerText = "Server wake-up time pass ho gaya. Ek baar fir Connect dabayein.";
                    alert("Server waking up, kripya 5 second baad dobara try karein.");
                } else {
                    statusText.innerText = "Error: " + error.message;
                    alert("Connection Error: " + error.message);
                }
            } finally {
                btn.disabled = false;
                btn.innerText = "Connect";
            }
        }
    </script>
</body>
</html>
